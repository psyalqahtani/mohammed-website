backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

locale: ar

collections:

  - name: "articles"
    label: "📝 المقالات"
    label_singular: "مقال"
    files:
      - label: "قائمة المقالات"
        name: "articles"
        file: "data/articles.json"
        fields:
          - label: "المقالات"
            name: "items"
            widget: "list"
            fields:
              - { label: "المعرف", name: "id", widget: "number" }
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "الرابط (slug)", name: "slug", widget: "string", hint: "بالإنجليزي بدون مسافات مثال: my-article" }
              - { label: "مقدمة مختصرة", name: "excerpt", widget: "text" }
              - label: "التصنيف"
                name: "category"
                widget: "select"
                options:
                  - { label: "القلق", value: "القلق" }
                  - { label: "الاكتئاب", value: "الاكتئاب" }
                  - { label: "العلاقات", value: "العلاقات" }
                  - { label: "التطوير الذاتي", value: "التطوير الذاتي" }
                  - { label: "الأطفال", value: "الأطفال" }
                  - { label: "علاج الإدمان", value: "علاج الإدمان" }
              - label: "لون التصنيف"
                name: "categoryColor"
                widget: "select"
                options:
                  - { label: "أزرق داكن", value: "#1B2D4F" }
                  - { label: "أخضر مائي", value: "#3D9B8F" }
                  - { label: "ذهبي", value: "#B8976A" }
                  - { label: "رمادي", value: "#5C6070" }
              - { label: "صورة المقال", name: "image", widget: "image", required: false }
              - { label: "تاريخ النشر", name: "date", widget: "string" }
              - { label: "وقت القراءة", name: "readTime", widget: "string" }
              - { label: "الكاتب", name: "author", widget: "string", default: "أ. محمد القحطاني" }
              - { label: "محتوى المقال", name: "body", widget: "markdown" }
              - label: "المراجع"
                name: "references"
                widget: "list"
                required: false
                field: { label: "مرجع", name: "ref", widget: "string" }

  - name: "library"
    label: "📚 المكتبة العلمية"
    files:
      - label: "قائمة الملفات"
        name: "files"
        file: "data/files.json"
        fields:
          - label: "الملفات"
            name: "items"
            widget: "list"
            fields:
              - { label: "المعرف", name: "id", widget: "number" }
              - { label: "الاسم", name: "title", widget: "string" }
              - { label: "وصف مختصر", name: "description", widget: "text" }
              - label: "النوع"
                name: "type"
                widget: "select"
                options: ["PDF", "PPT", "DOC", "XLS"]
              - label: "التصنيف"
                name: "category"
                widget: "select"
                options:
                  - { label: "أدلة إرشادية", value: "أدلة إرشادية" }
                  - { label: "مواد تدريبية", value: "مواد تدريبية" }
                  - { label: "مقاييس نفسية", value: "مقاييس نفسية" }
                  - { label: "عروض تقديمية", value: "عروض تقديمية" }
                  - { label: "كتب", value: "كتب" }
              - label: "لون الأيقونة"
                name: "color"
                widget: "select"
                options:
                  - { label: "أخضر", value: "#3D9B8F" }
                  - { label: "ذهبي", value: "#B8976A" }
                  - { label: "أزرق", value: "#1B2D4F" }
              - { label: "الملف للتحميل", name: "file", widget: "file", required: false }
              - { label: "صورة مخصصة", name: "image", widget: "image", required: false }
              - { label: "الحجم", name: "size", widget: "string" }
              - { label: "التاريخ", name: "date", widget: "string" }

  - name: "courses"
    label: "🎓 الدورات"
    files:
      - label: "قائمة الدورات"
        name: "courses"
        file: "data/courses.json"
        fields:
          - label: "الدورات"
            name: "items"
            widget: "list"
            fields:
              - { label: "المعرف", name: "id", widget: "number" }
              - { label: "العنوان", name: "title", widget: "string" }
              - { label: "الوصف", name: "description", widget: "text" }
              - label: "الحالة"
                name: "status"
                widget: "select"
                options:
                  - { label: "قادم", value: "قادم" }
                  - { label: "جارٍ", value: "جارٍ" }
                  - { label: "منتهٍ", value: "منتهٍ" }
              - label: "لون الحالة"
                name: "statusColor"
                widget: "select"
                options:
                  - { label: "ذهبي", value: "#B8976A" }
                  - { label: "أخضر", value: "#3D9B8F" }
                  - { label: "رمادي", value: "#5C6070" }
              - { label: "صورة", name: "image", widget: "image", required: false }
              - { label: "التاريخ", name: "date", widget: "string" }
              - { label: "المدة", name: "duration", widget: "string" }
              - label: "الطريقة"
                name: "mode"
                widget: "select"
                options: ["أونلاين", "حضوري", "هجين"]

  - name: "settings"
    label: "⚙️ إعدادات الموقع"
    files:
      - label: "المعلومات الشخصية"
        name: "personal"
        file: "data/settings.json"
        fields:
          - { label: "الاسم", name: "name", widget: "string" }
          - { label: "اللقب المهني", name: "title", widget: "string" }
          - { label: "النبذة", name: "hero_bio", widget: "text" }
          - { label: "البريد", name: "email", widget: "string" }
          - { label: "العنوان", name: "address", widget: "string" }
          - { label: "أوقات العمل", name: "hours", widget: "string" }
          - { label: "الصورة الشخصية", name: "photo", widget: "image" }
          - { label: "سنوات الخبرة", name: "stat_years", widget: "string" }
          - { label: "عدد الجلسات", name: "stat_sessions", widget: "string" }
          - { label: "ساعات التدريب", name: "stat_training", widget: "string" }
          - { label: "تويتر", name: "twitter", widget: "string", required: false }
          - { label: "إنستغرام", name: "instagram", widget: "string", required: false }
          - { label: "لينكدإن", name: "linkedin", widget: "string", required: false }
          - { label: "يوتيوب", name: "youtube", widget: "string", required: false }
