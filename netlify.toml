[build]
  publish = "."

# تفعيل Git Gateway للـ CMS
[[plugins]]
  package = "@netlify/plugin-netlify-graph"

# Redirects
[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

# Headers للأمان
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
